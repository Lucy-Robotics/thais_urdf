name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    uses: Lucy-Robotics/.github/.github/workflows/robot-package-ci.yaml@cma/fix-robot-package-ci-generalize
    with:
      package_name: thais_urdf
      ros_distro: humble
      gz_packages: gz-harmonic

  upload-coverage:
    needs: build-and-test
    uses: Lucy-Robotics/.github/.github/workflows/codecov-upload.yaml@cma/fix-robot-package-ci-generalize
    with:
      artifact_name: coverage-thais_urdf
      flags: thais_urdf
      name: thais_urdf
    secrets: inherit
